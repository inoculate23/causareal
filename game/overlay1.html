<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@300;700&display=swap');

        :root {
            --earth-red: #8b2f1a;
            --pigment-gold: #c9932e;
            --ash: #121210;
            --bone: #e2d9c8;
            --grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Archivo Black', sans-serif;
        }

        #overlay-root {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--ash);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.2s cubic-bezier(0.83, 0, 0.17, 1), transform 1.2s cubic-bezier(0.83, 0, 0.17, 1);
            color: var(--bone);
        }

        #overlay-root::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: var(--grain);
            opacity: 0.15;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* The Textile Borders */
        .andean-pattern {
            position: absolute;
            width: 60px;
            height: 100%;
            background-color: var(--earth-red);
            opacity: 0.8;
            mask-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l30 30-30 30L0 30z' fill='black'/%3E%3C/svg%3E");
            mask-size: 40px 40px;
            z-index: 1;
        }

        .pattern-left { left: 20px; border-right: 2px solid var(--pigment-gold); }
        .pattern-right { right: 20px; border-left: 2px solid var(--pigment-gold); }

        /* Main Branding */
        .brand-container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            perspective: 1000px;
        }

        .logo-wrap {
            position: relative;
            display: inline-block;
            transform-style: preserve-3d;
            animation: stencil-float 6s ease-in-out infinite;
        }

        .title {
            font-size: clamp(4rem, 15vw, 12rem);
            line-height: 0.85;
            text-transform: uppercase;
            color: var(--bone);
            position: relative;
            mix-blend-mode: difference;
            letter-spacing: -0.05em;
            filter: url(#stencil-filter);
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5em;
            color: var(--pigment-gold);
            margin-top: 20px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .subtitle::before, .subtitle::after {
            content: "";
            height: 1px;
            width: 50px;
            background: var(--earth-red);
        }

        /* Loading progress */
        .loader-ui {
            margin-top: 60px;
            width: 280px;
            position: relative;
        }

        .bar-bg {
            height: 4px;
            width: 100%;
            background: rgba(226, 217, 200, 0.1);
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: var(--earth-red);
            box-shadow: 0 0 15px var(--earth-red);
            transition: width 0.4s ease;
        }

        .status-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            color: var(--pigment-gold);
            text-transform: uppercase;
        }

        /* Stencil Distortion Filter */
        svg#filters {
            position: absolute;
            height: 0;
            width: 0;
        }

        @keyframes stencil-float {
            0%, 100% { transform: rotateY(-5deg) translateY(0); }
            50% { transform: rotateY(5deg) translateY(-10px); }
        }

        /* Scene Load Logic State */
        .loaded #overlay-root {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        /* Gritty Accents */
        .accent-box {
            position: absolute;
            bottom: 40px;
            left: 100px;
            padding: 20px;
            border-left: 1px solid var(--pigment-gold);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--bone);
            max-width: 250px;
            opacity: 0.6;
            z-index: 2;
        }

        .accent-box b { color: var(--earth-red); }

    </style>
</head>
<body>

    <!-- SVG Filters for Gritty Stencil Look -->
    <svg id="filters">
        <filter id="stencil-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" />
        </filter>
    </svg>

    <div id="overlay-root">
        <div class="andean-pattern pattern-left"></div>
        <div class="andean-pattern pattern-right"></div>

        <div class="brand-container">
            <div class="logo-wrap">
                <h1 class="title">CAUSA<br>REAL</h1>
            </div>
            <div class="subtitle">Callao • Lima • Underground</div>
        </div>

        <div class="loader-ui">
            <div class="bar-bg">
                <div class="bar-fill" id="progress-bar"></div>
            </div>
            <div class="status-text">
                <span id="percent-text">00%</span>
                <span>Establishing Connection</span>
                <span id="coord-text">12.0464° S</span>
            </div>
        </div>

        <div class="accent-box">
            <b>SISTEMA DE SONIDO</b><br>
            Raw Peruvian Rap. Heritage and grit combined. Initializing audio-visual synchronizer...
        </div>
    </div>

    <!-- Background Mock (The "Scene") -->
    <div style="width: 100vw; height: 100vh; background: radial-gradient(circle, #222, #000); display: flex; align-items: center; justify-content: center; color: white;">
        <h2 style="font-family: sans-serif; letter-spacing: 10px; opacity: 0.5;">SCENE ACTIVE</h2>
    </div>

    <script>
        /**
         * Flash UI - Causa Real Overlay Controller
         */
        const bar = document.getElementById('progress-bar');
        const percentText = document.getElementById('percent-text');
        const overlay = document.body;

        let progress = 0;
        
        // Simulated Loading Sequence
        const interval = setInterval(() => {
            // Random incremental jumps for grit/realism
            progress += Math.random() * 15;
            
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                completeLoading();
            }

            bar.style.width = progress + '%';
            percentText.innerText = Math.floor(progress).toString().padStart(2, '0') + '%';
        }, 150);

        function completeLoading() {
            setTimeout(() => {
                overlay.classList.add('loaded');
                // Cleanup DOM after transition
                setTimeout(() => {
                    document.getElementById('overlay-root').remove();
                }, 1500);
            }, 600);
        }

        // Coordinate randomization for aesthetic
        setInterval(() => {
            const coord = document.getElementById('coord-text');
            if(coord) {
                const lat = (12.0464 + (Math.random() * 0.01)).toFixed(4);
                coord.innerText = lat + '° S';
            }
        }, 2000);
    </script>
</body>
</html>
